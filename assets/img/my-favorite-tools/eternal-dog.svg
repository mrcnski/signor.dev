<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Diagram of an ssh connection dying while the EternalTerminal session line continues unbroken">
  <defs>
    <pattern id="griddots-et" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#23233A"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="420" rx="16" fill="#14141F"/>
  <rect x="0" y="0" width="800" height="420" rx="16" fill="url(#griddots-et)"/>

  <!-- laptop (left) -->
  <g stroke="#8FB8E8" stroke-width="4" fill="none" stroke-linejoin="round">
    <rect x="52" y="164" width="76" height="52" rx="6"/>
    <path d="M42 216 h96 l-8 16 h-80 z" fill="#8FB8E8" stroke="none" opacity="0.5"/>
    <text x="90" y="200" text-anchor="middle" font-family="Menlo, monospace" font-size="16" fill="#98C379" stroke="none">&gt;_</text>
  </g>

  <!-- server rack (right) -->
  <g>
    <rect x="660" y="140" width="90" height="110" rx="8" fill="none" stroke="#8FB8E8" stroke-width="4"/>
    <line x1="660" y1="177" x2="750" y2="177" stroke="#8FB8E8" stroke-width="3"/>
    <line x1="660" y1="214" x2="750" y2="214" stroke="#8FB8E8" stroke-width="3"/>
    <circle cx="678" cy="158" r="4" fill="#98C379"/>
    <circle cx="678" cy="195" r="4" fill="#98C379"/>
    <circle cx="678" cy="232" r="4" fill="#F5C542"/>
    <g stroke="#585B70" stroke-width="3" stroke-linecap="round">
      <line x1="712" y1="158" x2="738" y2="158"/>
      <line x1="712" y1="195" x2="738" y2="195"/>
      <line x1="712" y1="232" x2="738" y2="232"/>
    </g>
  </g>

  <!-- event markers -->
  <g stroke="#3A3A58" stroke-width="2" stroke-dasharray="4 6">
    <line x1="330" y1="80" x2="330" y2="340"/>
    <line x1="500" y1="80" x2="500" y2="340"/>
  </g>
  <!-- moon: laptop sleeps -->
  <path d="M338 56 a16 16 0 1 0 8 30 a13 13 0 0 1 -8 -30 z" transform="translate(-14,0)" fill="#8FB8E8" opacity="0.9"/>
  <text x="330" y="106" text-anchor="middle" font-family="Menlo, monospace" font-size="13" fill="#6C7086">laptop sleeps</text>
  <!-- sun: laptop opens -->
  <g transform="translate(500,64)">
    <circle cx="0" cy="0" r="9" fill="#F5C542"/>
    <g stroke="#F5C542" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="-21"/>
      <line x1="15" y1="0" x2="21" y2="0"/>
      <line x1="-15" y1="0" x2="-21" y2="0"/>
      <line x1="11" y1="-11" x2="15" y2="-15"/>
      <line x1="-11" y1="-11" x2="-15" y2="-15"/>
    </g>
  </g>
  <text x="500" y="106" text-anchor="middle" font-family="Menlo, monospace" font-size="13" fill="#6C7086">laptop opens</text>

  <!-- ssh lane -->
  <text x="160" y="152" font-family="Menlo, monospace" font-size="16" fill="#CDD6F4">ssh</text>
  <line x1="160" y1="180" x2="318" y2="180" stroke="#98C379" stroke-width="5" stroke-linecap="round"/>
  <!-- death X -->
  <g stroke="#E06C75" stroke-width="5" stroke-linecap="round">
    <line x1="322" y1="172" x2="338" y2="188"/>
    <line x1="338" y1="172" x2="322" y2="188"/>
  </g>
  <text x="352" y="186" font-family="Menlo, monospace" font-size="14" fill="#E06C75">connection reset by peer</text>

  <!-- et lane -->
  <text x="160" y="272" font-family="Menlo, monospace" font-size="16" fill="#CDD6F4">et</text>
  <!-- glow underlay -->
  <line x1="160" y1="300" x2="644" y2="300" stroke="#F5C542" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
  <line x1="160" y1="300" x2="644" y2="300" stroke="#F5C542" stroke-width="5" stroke-linecap="round"/>
  <!-- pulse dots riding the line -->
  <g fill="#FDF6EC">
    <circle cx="330" cy="300" r="4"/>
    <circle cx="500" cy="300" r="4"/>
  </g>
  <text x="160" y="340" font-family="Menlo, monospace" font-size="14" fill="#98C379">✓ session intact</text>
</svg>
