<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="A terminal fuzzy-finding through a list of favorite tools, beside a constellation of stars">
  <defs>
    <pattern id="griddots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#23233A"/>
    </pattern>
    <radialGradient id="starglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="480" rx="16" fill="#14141F"/>
  <rect x="0" y="0" width="900" height="480" rx="16" fill="url(#griddots)"/>

  <!-- terminal window -->
  <g>
    <rect x="52" y="64" width="480" height="356" rx="12" fill="#1B1B2A" stroke="#2E2E48" stroke-width="2"/>
    <!-- title bar -->
    <path d="M52 76 q0 -12 12 -12 h456 q12 0 12 12 v22 h-480 z" fill="#232338"/>
    <circle cx="76" cy="81" r="6" fill="#E06C75"/>
    <circle cx="98" cy="81" r="6" fill="#E5C07B"/>
    <circle cx="120" cy="81" r="6" fill="#98C379"/>
    <text x="292" y="86" text-anchor="middle" font-family="Menlo, monospace" font-size="13" fill="#6C7086">~/favorites</text>

    <!-- prompt -->
    <text x="80" y="130" font-family="Menlo, monospace" font-size="16" fill="#98C379">$ <tspan fill="#CDD6F4">gh stars | fzf</tspan></text>

    <!-- fzf counter -->
    <text x="80" y="160" font-family="Menlo, monospace" font-size="15" fill="#6C7086">16/16 ────────────────────────</text>

    <!-- selection row -->
    <rect x="68" y="172" width="448" height="28" rx="5" fill="#2A2A45"/>
    <text x="80" y="192" font-family="Menlo, monospace" font-size="16" fill="#F38BA8">❯ <tspan fill="#CDD6F4" font-weight="bold">ripgrep</tspan></text>
    <text x="420" y="192" font-family="Menlo, monospace" font-size="15" fill="#F5C542">★ 66k</text>

    <!-- list rows -->
    <g font-family="Menlo, monospace" font-size="16" fill="#9399B2">
      <text x="98" y="222">fzf</text>
      <text x="98" y="252">magit</text>
      <text x="98" y="282">consult</text>
      <text x="98" y="312">keepassxc</text>
      <text x="98" y="342">beancount</text>
      <text x="98" y="372">eyebrowse</text>
      <text x="98" y="402">promptu</text>
    </g>
    <g font-family="Menlo, monospace" font-size="15" fill="#585B70">
      <text x="420" y="222">★ 82k</text>
      <text x="420" y="252">★ 7.2k</text>
      <text x="420" y="282">★ 1.6k</text>
      <text x="420" y="312">★ 28k</text>
      <text x="420" y="342">★ 5.8k</text>
      <text x="420" y="372">★ 1</text>
      <text x="420" y="402">★ 1</text>
    </g>
  </g>

  <!-- constellation -->
  <g>
    <!-- connecting lines -->
    <g stroke="#3A3A58" stroke-width="2">
      <line x1="640" y1="130" x2="726" y2="196"/>
      <line x1="726" y1="196" x2="830" y2="122"/>
      <line x1="726" y1="196" x2="672" y2="290"/>
      <line x1="672" y1="290" x2="762" y2="352"/>
      <line x1="762" y1="352" x2="846" y2="286"/>
      <line x1="672" y1="290" x2="596" y2="368"/>
    </g>

    <!-- glow behind main star -->
    <circle cx="726" cy="196" r="70" fill="url(#starglow)"/>

    <!-- main star -->
    <path d="M0 -60 L14.7 -20.2 L57.1 -18.5 L23.8 7.7 L35.3 48.5 L0 25 L-35.3 48.5 L-23.8 7.7 L-57.1 -18.5 L-14.7 -20.2 Z"
          transform="translate(726,204) scale(0.62)" fill="#F5C542"/>

    <!-- node stars (4-point) -->
    <g fill="#8FB8E8">
      <path d="M640 114 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
      <path d="M830 106 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
      <path d="M672 274 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
      <path d="M762 336 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
      <path d="M846 270 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
      <path d="M596 352 l4.5 11.5 11.5 4.5 -11.5 4.5 -4.5 11.5 -4.5 -11.5 -11.5 -4.5 11.5 -4.5 z"/>
    </g>

    <!-- distant specks -->
    <g fill="#585B70">
      <circle cx="590" cy="90" r="2.5"/>
      <circle cx="870" cy="200" r="2.5"/>
      <circle cx="620" cy="220" r="2"/>
      <circle cx="800" cy="410" r="2.5"/>
      <circle cx="700" cy="60" r="2"/>
      <circle cx="640" cy="430" r="2"/>
    </g>
  </g>
</svg>
