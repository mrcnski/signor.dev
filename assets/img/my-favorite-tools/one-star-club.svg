<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Two GitHub repository cards, each with one star, linked to a single shared golden star">
  <defs>
    <pattern id="griddots-osc" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#23233A"/>
    </pattern>
    <radialGradient id="starglow-osc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="440" rx="16" fill="#14141F"/>
  <rect x="0" y="0" width="800" height="440" rx="16" fill="url(#griddots-osc)"/>

  <!-- header comment -->
  <text x="400" y="52" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#6C7086"># one-star club · members: 2 · thursdays 19:00</text>

  <!-- the shared star -->
  <circle cx="400" cy="140" r="66" fill="url(#starglow-osc)"/>
  <path d="M0 -60 L14.7 -20.2 L57.1 -18.5 L23.8 7.7 L35.3 48.5 L0 25 L-35.3 48.5 L-23.8 7.7 L-57.1 -18.5 L-14.7 -20.2 Z"
        transform="translate(400,146) scale(0.55)" fill="#F5C542"/>

  <!-- dashed links from cards to star -->
  <g stroke="#3A3A58" stroke-width="2.5" stroke-dasharray="5 7">
    <line x1="230" y1="248" x2="368" y2="172"/>
    <line x1="570" y1="248" x2="432" y2="172"/>
  </g>

  <!-- left repo card: promptu -->
  <g transform="translate(88,252)">
    <rect x="0" y="0" width="284" height="140" rx="10" fill="#1B1B2A" stroke="#2E2E48" stroke-width="2"/>
    <!-- repo icon -->
    <g stroke="#8FB8E8" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <path d="M24 22 q0 -6 6 -6 h16 v22 h-16 q-6 0 -6 -4 z"/>
      <line x1="30" y1="16" x2="30" y2="38"/>
    </g>
    <text x="58" y="32" font-family="Menlo, monospace" font-size="16" fill="#8FB8E8" font-weight="bold">mrcnski/promptu</text>
    <text x="24" y="70" font-family="Menlo, monospace" font-size="13" fill="#9399B2">Compose LLM prompts from</text>
    <text x="24" y="90" font-family="Menlo, monospace" font-size="13" fill="#9399B2">building blocks</text>
    <circle cx="30" cy="116" r="6" fill="#C065DB"/>
    <text x="44" y="121" font-family="Menlo, monospace" font-size="13" fill="#6C7086">Emacs Lisp</text>
    <text x="220" y="121" font-family="Menlo, monospace" font-size="14" fill="#F5C542">★ 1</text>
  </g>

  <!-- right repo card: eyebrowse -->
  <g transform="translate(428,252)">
    <rect x="0" y="0" width="284" height="140" rx="10" fill="#1B1B2A" stroke="#2E2E48" stroke-width="2"/>
    <!-- fork icon -->
    <g stroke="#8FB8E8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <circle cx="26" cy="18" r="4.5"/>
      <circle cx="42" cy="18" r="4.5"/>
      <circle cx="34" cy="38" r="4.5"/>
      <path d="M26 22 q0 9 8 11 M42 22 q0 9 -8 11"/>
    </g>
    <text x="58" y="32" font-family="Menlo, monospace" font-size="16" fill="#8FB8E8" font-weight="bold">mrcnski/eyebrowse</text>
    <text x="24" y="70" font-family="Menlo, monospace" font-size="13" fill="#9399B2">Window configurations for</text>
    <text x="24" y="90" font-family="Menlo, monospace" font-size="13" fill="#9399B2">Emacs · fork, kept alive</text>
    <circle cx="30" cy="116" r="6" fill="#C065DB"/>
    <text x="44" y="121" font-family="Menlo, monospace" font-size="13" fill="#6C7086">Emacs Lisp</text>
    <text x="220" y="121" font-family="Menlo, monospace" font-size="14" fill="#F5C542">★ 1</text>
  </g>

  <!-- distant specks -->
  <g fill="#585B70">
    <circle cx="90" cy="110" r="2.5"/>
    <circle cx="700" cy="90" r="2.5"/>
    <circle cx="160" cy="180" r="2"/>
    <circle cx="640" cy="180" r="2"/>
    <circle cx="740" cy="410" r="2"/>
    <circle cx="60" cy="410" r="2"/>
  </g>
</svg>
